[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafc"
version = "0.1.0"
description = "Deadline-Aware Fault Containment for distributed AI agent workflows: research simulator, baselines, and experiments"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.168.5", "networkx==3.7"]

[project.scripts]
dafc = "dafc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
